site_name: Arquitectura de software e integración de IA
site_description: Decisiones de arquitectura backend e integración fiable de IA, con implementación y verificación
docs_dir: docs
site_dir: site
theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo claro
  features: [navigation.sections, navigation.footer, content.code.copy, navigation.top, toc.follow]
plugins: [search]
hooks: [tools/docs/source_links.py]
markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
nav:
  - Referencia:
      - Cómo utilizar esta referencia: index.md
      - 0. Preparación y primer pedido: getting-started.md
      - 1. Organización del código: handbook/architecture.md
      - 2. Contratos HTTP: handbook/api-contracts.md
      - 3. Transacciones y concurrencia: handbook/transactions.md
      - 4. Eventos y Kafka Streams: handbook/events.md
      - 5. Documentos e IA: handbook/retrieval.md
      - 6. Devoluciones y aprobación: handbook/workflows.md
      - 7. Seguridad y resiliencia: handbook/security.md
      - 8. Observabilidad y diagnóstico: handbook/operations.md
      - 9. Despliegue y cambios: handbook/delivery.md
  - Consulta:
      - Aplicaciones y datos: repository-design.md
      - Mapa de referencia: reference-map.md
      - Bibliografía recomendada: bibliography.md
      - Decisiones de arquitectura: decisions/index.md
      - Especificación: specification.md
      - Criterios de aceptación: acceptance.md
      - Verificación y límites: verification.md
      - Contribuir: contributing.md

name: architecture-reference
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_USER: localadmin
      POSTGRES_PASSWORD: local-admin-only
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./infra/local/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports: ["127.0.0.1:5434:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U localadmin -d postgres"]
      interval: 5s
      retries: 30
    mem_limit: 512m
  kafka:
    image: apache/kafka:4.0.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka:/var/lib/kafka/data"]
    ports: ["127.0.0.1:9092:9094"]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
    mem_limit: 1g
  topics:
    image: apache/kafka:4.0.2
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for topic in orders.placed.v1 orders.summary.v1 orders.placed.v1.dlt orders.analytics.v1.dlt; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1 --config retention.ms=604800000
        done
    mem_limit: 256m
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak-local
      KC_HOSTNAME: http://localhost:8088
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx384m
    depends_on:
      postgres: {condition: service_healthy}
    volumes: ["./infra/local/realm.json:/opt/keycloak/data/import/reference-realm.json:ro"]
    ports: ["127.0.0.1:8088:8080"]
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; cat <&3 | grep -q UP'"]
      interval: 10s
      timeout: 5s
      retries: 40
    mem_limit: 768m
  commerce-api:
    image: architecture-reference/commerce-api:local
    build: ./apps/commerce-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/commerce
      DB_USER: commerce
      DB_PASSWORD: commerce-local
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OIDC_ISSUER: http://localhost:8088/realms/reference
      OIDC_JWKS: http://keycloak:8080/realms/reference/protocol/openid-connect/certs
      OIDC_AUDIENCE: reference-api
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.0}
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: ${TRACING_ENABLED:-false}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      postgres: {condition: service_healthy}
      topics: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
    ports: ["127.0.0.1:8080:8080"]
    mem_limit: 768m
  ai-service:
    image: architecture-reference/ai-service:local
    build: ./apps/ai-service
    environment:
      OIDC_ISSUER: http://localhost:8088/realms/reference
      OIDC_JWKS_URL: http://keycloak:8080/realms/reference/protocol/openid-connect/certs
      OIDC_AUDIENCE: reference-api
      COMMERCE_URL: http://commerce-api:8080
      WORKFLOW_DB: /data/workflows.sqlite
      AI_PROVIDER: fake
      VECTOR_DSN: postgresql://ai:ai-local@postgres:5432/ai
      OTEL_EXPORTER_OTLP_ENDPOINT: ${AI_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ai-service
    depends_on:
      commerce-api: {condition: service_started}
    volumes: ["workflows:/data"]
    ports: ["127.0.0.1:8081:8081"]
    mem_limit: 512m
  order-analytics:
    image: architecture-reference/order-analytics:local
    build: ./apps/order-analytics
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STATE_DIR: /state
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
    depends_on:
      topics: {condition: service_completed_successfully}
    volumes: ["streams:/state"]
    mem_limit: 768m
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    profiles: [observability]
    command: [--config=/etc/otel/config.yaml]
    volumes: ["./infra/observability/collector.yaml:/etc/otel/config.yaml:ro"]
    mem_limit: 256m
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    volumes:
      - ./infra/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 256m
  tempo:
    image: grafana/tempo:2.7.2
    profiles: [observability]
    command: [-config.file=/etc/tempo.yaml]
    volumes: ["./infra/observability/tempo.yaml:/etc/tempo.yaml:ro"]
    mem_limit: 256m
  grafana:
    image: grafana/grafana:11.6.0
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./infra/observability/datasources.yaml:/etc/grafana/provisioning/datasources/reference.yaml:ro
      - ./infra/observability/dashboards.yaml:/etc/grafana/provisioning/dashboards/reference.yaml:ro
      - ./infra/observability/dashboard.json:/var/lib/grafana/dashboards/reference.json:ro
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 256m
volumes:
  postgres:
  kafka:
  workflows:
  streams:

[project]
name = "architecture-ai-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.8,<3",
    "PyJWT[crypto]>=2.10,<3",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "psycopg[binary]>=3.2,<4",
    "prometheus-client>=0.21,<1",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-instrumentation-fastapi>=0.50b0,<1",
    "opentelemetry-instrumentation-httpx>=0.50b0,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "import-linter>=2,<3"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ai_service"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
[tool.importlinter]
root_package = "ai_service"
include_external_packages = true
[[tool.importlinter.contracts]]
name = "Domain is independent"
type = "forbidden"
source_modules = ["ai_service.domain"]
forbidden_modules = ["ai_service.application", "ai_service.infrastructure", "fastapi", "langgraph", "httpx"]
[[tool.importlinter.contracts]]
name = "Application uses ports"
type = "forbidden"
source_modules = ["ai_service.application"]
forbidden_modules = ["ai_service.infrastructure", "fastapi"]

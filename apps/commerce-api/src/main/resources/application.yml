server:
  port: 8080
spring:
  application:
    name: commerce-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/reference}
    username: ${DB_USER:reference}
    password: ${DB_PASSWORD:reference}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: commerce-audit-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      observation-enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8088/realms/reference}
          jwk-set-uri: ${OIDC_JWKS:http://localhost:8088/realms/reference/protocol/openid-connect/certs}
management:
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
app:
  audience: ${OIDC_AUDIENCE:reference-api}
  events:
    enabled: ${EVENTS_ENABLED:true}

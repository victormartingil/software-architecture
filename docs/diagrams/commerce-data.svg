<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1280" viewBox="0 0 1120 1280" role="img" aria-labelledby="title"><title id="title">Datos de Comercio · modelo físico</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text data-cell="title" x="40" y="66" font-size="32" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Datos de Comercio · modelo físico</text><text data-cell="subtitle" x="40" y="121" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">PostgreSQL · columnas esenciales y restricciones declaradas en Flyway V1 + V2.</text><rect x="40" y="190" width="450" height="270" rx="6.75" data-cell="orders-table-shape" fill="#173C46" stroke="#CBD5DF" stroke-width="1.3"/><text data-cell="orders-table-kind" x="58" y="221.5" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#D4E6E5">PEDIDO</text><text data-cell="orders-table-title" x="58" y="261.5" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#FFFFFF">orders</text><text data-cell="orders-table-body" x="58" y="329" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">PK id</text><text data-cell="orders-table-body" x="58" y="357" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">tenant · actor · sku</text><text data-cell="orders-table-body" x="58" y="385" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">quantity · total_cents</text><text data-cell="orders-table-body" x="58" y="413" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">status · version</text><rect x="650" y="190" width="430" height="270" rx="6.75" data-cell="returns-table-shape" fill="#FFF8E9" stroke="#CBD5DF" stroke-width="1.3"/><text data-cell="returns-table-kind" x="668" y="221.5" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#916623">PROPUESTA DE DEVOLUCIÓN</text><text data-cell="returns-table-title" x="668" y="261.5" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">return_proposals</text><text data-cell="returns-table-body" x="668" y="330.6" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">PK id</text><text data-cell="returns-table-body" x="668" y="357.2" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">FK + UNIQUE order_id → orders.id</text><text data-cell="returns-table-body" x="668" y="383.8" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">status · version</text><text data-cell="returns-table-body" x="668" y="410.4" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">approved_until · approved_by</text><rect x="40" y="550" width="450" height="210" rx="5.25" data-cell="inbox-table-shape" fill="#FFF8E9" stroke="#CBD5DF" stroke-width="1.3"/><text data-cell="inbox-table-kind" x="58" y="581.5" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#916623">IDENTIDAD YA CONSUMIDA</text><text data-cell="inbox-table-title" x="58" y="621.5" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">inbox</text><text data-cell="inbox-table-body" x="58" y="687" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">PK event_id</text><text data-cell="inbox-table-body" x="58" y="715" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">processed_at</text><rect x="650" y="550" width="430" height="210" rx="5.25" data-cell="audit-table-shape" fill="#FFF8E9" stroke="#CBD5DF" stroke-width="1.3"/><text data-cell="audit-table-kind" x="668" y="581.5" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#916623">EFECTO DE AUDITORÍA</text><text data-cell="audit-table-title" x="668" y="621.5" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">audit_orders</text><text data-cell="audit-table-body" x="668" y="687.2" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">PK + FK event_id → inbox.event_id</text><text data-cell="audit-table-body" x="668" y="713.8" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">order_id · tenant</text><rect x="40" y="850" width="300" height="230" rx="5.75" data-cell="inventory-table-shape" fill="#FFF8E9" stroke="#CBD5DF" stroke-width="1.3"/><text data-cell="inventory-table-kind" x="58" y="881.5" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#916623">INVENTARIO</text><text data-cell="inventory-table-title" x="58" y="921.5" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">inventory</text><text data-cell="inventory-table-body" x="58" y="984.8" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">PK (tenant, sku)</text><text data-cell="inventory-table-body" x="58" y="1010" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">stock ≥ 0 · price &gt; 0</text><text data-cell="inventory-table-body" x="58" y="1035.2" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">version</text><rect x="410" y="850" width="300" height="230" rx="5.75" data-cell="outbox-table-shape" fill="#FFF8E9" stroke="#CBD5DF" stroke-width="1.3"/><text data-cell="outbox-table-kind" x="428" y="881.5" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#916623">EVENTO PENDIENTE</text><text data-cell="outbox-table-title" x="428" y="921.5" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">outbox</text><text data-cell="outbox-table-body" x="428" y="984.8" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">PK event_id</text><text data-cell="outbox-table-body" x="428" y="1010" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">aggregate_id · payload</text><text data-cell="outbox-table-body" x="428" y="1035.2" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">published_at · attempts</text><rect x="780" y="850" width="300" height="230" rx="5.75" data-cell="idempotency-table-shape" fill="#FFF8E9" stroke="#CBD5DF" stroke-width="1.3"/><text data-cell="idempotency-table-kind" x="798" y="881.5" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#916623">RESULTADO REUTILIZABLE</text><text data-cell="idempotency-table-title" x="798" y="921.5" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">idempotency</text><text data-cell="idempotency-table-body" x="798" y="984.8" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">PK scope · JSON (5 campos)</text><text data-cell="idempotency-table-body" x="798" y="1010" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">scope_version = 2</text><text data-cell="idempotency-table-body" x="798" y="1035.2" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">request_hash · result</text><path d="M 650 325 L 490 325" data-cell="return-order-fk" fill="none" stroke="#7D8D9C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 650 655 L 490 655" data-cell="audit-inbox-fk" fill="none" stroke="#7D8D9C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text data-cell="data-legend" x="40" y="1139" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Líneas: FK reales. Un pedido admite 0..1 propuesta; un inbox admite 0..1 efecto de auditoría.</text><text data-cell="logical-refs" x="40" y="1179" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Sin FK: orders → inventory; outbox.aggregate_id → orders; audit_orders.order_id → orders.</text><text data-cell="scope-note" x="40" y="1219" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">scope contiene cinco componentes JSON; scope_version es una columna separada.</text><text data-cell="data-scope" x="40" y="1259" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Solo BD commerce. SQLite, pgvector y Keycloak tienen otros esquemas y responsabilidades.</text><rect data-label-for="return-order-fk" x="500" y="300.6" width="140" height="48.8" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="return-order-fk" data-label-for="return-order-fk" x="570" y="321.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">1 : 0..1</text><text data-cell="return-order-fk" data-label-for="return-order-fk" x="570" y="345.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">FK order_id</text><rect data-label-for="audit-inbox-fk" x="500" y="630.6" width="140" height="48.8" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="audit-inbox-fk" data-label-for="audit-inbox-fk" x="570" y="651.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">1 : 0..1</text><text data-cell="audit-inbox-fk" data-label-for="audit-inbox-fk" x="570" y="675.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">FK event_id</text></svg>

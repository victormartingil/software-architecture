<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1020" viewBox="0 0 1050 1020" role="img" aria-labelledby="title"><title id="title">Quién usa la tienda y para qué</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text data-cell="title" x="30" y="57.5" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Quién usa la tienda y para qué</text><text data-cell="subtitle" x="30" y="109" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">C4 · Nivel 1 / Contexto    —    Los detalles internos aparecen en las otras vistas.</text><rect x="60" y="160" width="360" height="140" rx="5.6" data-cell="buyer-shape" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="buyer-kind" x="76" y="188" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#58697A">PERSONA</text><text data-cell="buyer-title" x="76" y="222" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Persona compradora</text><text data-cell="buyer-body" x="76" y="272.5" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Crea pedidos y consulta políticas.</text><rect x="630" y="160" width="360" height="140" rx="5.6" data-cell="manager-shape" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="manager-kind" x="646" y="188" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#58697A">PERSONA</text><text data-cell="manager-title" x="646" y="222" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Responsable autorizado</text><text data-cell="manager-body" x="646" y="272.5" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Aprueba devoluciones de su organización.</text><rect x="345" y="445" width="360" height="160" rx="6.4" data-cell="shop-shape" fill="#173C46" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="shop-kind" x="361" y="473" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#D4E6E5">SISTEMA DE SOFTWARE</text><text data-cell="shop-title" x="361" y="507" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#FFFFFF">Tienda de referencia</text><text data-cell="shop-body" x="361" y="554.9" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">Pedidos y resúmenes.</text><text data-cell="shop-body" x="361" y="580.1" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">Asistente de políticas.</text><rect x="60" y="790" width="360" height="140" rx="5.6" data-cell="identity-shape" fill="#F7F3FC" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="identity-kind" x="76" y="818" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#58697A">SISTEMA INDEPENDIENTE</text><text data-cell="identity-title" x="76" y="852" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Servidor de identidad</text><text data-cell="identity-body" x="76" y="902.5" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Keycloak · tokens y claves de firma.</text><rect x="630" y="790" width="360" height="140" rx="5.6" data-cell="llm-shape" fill="#F7F3FC" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="llm-kind" x="646" y="818" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#58697A">SISTEMA EXTERNO · OPCIONAL</text><text data-cell="llm-title" x="646" y="852" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Proveedor de IA</text><text data-cell="llm-body" x="646" y="902.5" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">OpenAI · generación y embeddings.</text><path d="M 312 300 L 312 354 Q 312 360 306 360 L 306 360 Q 300 360 300 366 L 300 483 Q 300 493 310 493 L 345 493" data-cell="buyer-shop" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 738 300 L 738 354 Q 738 360 744 360 L 744 360 Q 750 360 750 366 L 750 483 Q 750 493 740 493 L 705 493" data-cell="manager-shop" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 417 605 L 417 690 Q 417 700 407 700 L 322 700 Q 312 700 312 710 L 312 790" data-cell="shop-identity" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 633 605 L 633 690 Q 633 700 643 700 L 728 700 Q 738 700 738 710 L 738 790" data-cell="shop-llm" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text data-cell="footer" x="30" y="983.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">No hay interfaz web propia: los escenarios locales realizan las peticiones HTTP como usuarios sintéticos.</text><rect data-label-for="buyer-shop" x="207.5" y="400.5" width="185" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="buyer-shop" data-label-for="buyer-shop" x="300" y="421.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Pedidos y consultas</text><rect data-label-for="manager-shop" x="657.5" y="400.5" width="185" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="manager-shop" data-label-for="manager-shop" x="750" y="421.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Aprobar devolución</text><rect data-label-for="shop-identity" x="267" y="687.5" width="200" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="shop-identity" data-label-for="shop-identity" x="367" y="708.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Obtiene claves públicas</text><rect data-label-for="shop-llm" x="568" y="687.5" width="230" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="shop-llm" data-label-for="shop-llm" x="683" y="708.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Genera a partir de evidencia</text></svg>

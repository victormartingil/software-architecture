<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1430" viewBox="0 0 1000 1430" role="img" aria-labelledby="title"><title id="title">Responder con documentos autorizados</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text data-cell="title" x="30" y="57.5" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Responder con documentos autorizados</text><text data-cell="subtitle" x="30" y="109" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Flujo dentro del asistente    —    RAG = recuperar evidencia y utilizarla para generar una respuesta.</text><rect x="80" y="150" width="380" height="110" rx="4.4" data-cell="question-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="question-title" x="96" y="189" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Pregunta + usuario</text><text data-cell="question-body" x="96" y="235.5" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Actor autenticado por JWT.</text><rect x="80" y="340" width="380" height="140" rx="5.6" data-cell="retrieve-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="retrieve-kind" x="96" y="368" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#58697A">RECUPERACIÓN · HASTA TRES FRAGMENTOS</text><text data-cell="retrieve-title" x="96" y="402" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Buscar documentos permitidos</text><text data-cell="retrieve-body" x="96" y="439.9" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Filtrar primero por organización (tenant).</text><text data-cell="retrieve-body" x="96" y="465.1" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Búsqueda por palabras; vectorial optativa.</text><polygon points="270,555 400,612.5 270,670 140,612.5" data-cell="evidence-shape" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="evidence-text" x="270" y="608.7" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">¿Hay</text><text data-cell="evidence-text" x="270" y="635.3" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">evidencia?</text><rect x="630" y="555" width="300" height="120" rx="4.8" data-cell="abstain-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="abstain-title" x="646" y="594" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Abstenerse</text><text data-cell="abstain-body" x="646" y="632.9" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">No llamar al proveedor.</text><text data-cell="abstain-body" x="646" y="658.1" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">200 · abstained=true</text><rect x="80" y="750" width="380" height="135" rx="5.4" data-cell="generate-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="generate-kind" x="96" y="778" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#58697A">PROVEEDOR DE RESPUESTAS</text><text data-cell="generate-title" x="96" y="812" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Generar respuesta</text><text data-cell="generate-body" x="96" y="847.4" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Simulación local predeterminada.</text><text data-cell="generate-body" x="96" y="872.6" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">LLM real con límites, si se configura.</text><polygon points="270,965 400,1022.5 270,1080 140,1022.5" data-cell="validate-shape" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="validate-text" x="270" y="1018.7" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">¿Formato y</text><text data-cell="validate-text" x="270" y="1045.3" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">citas válidos?</text><rect x="630" y="965" width="300" height="120" rx="4.8" data-cell="error-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="error-title" x="646" y="1004" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Rechazar respuesta</text><text data-cell="error-body" x="646" y="1055.5" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">503 · sin evidencia inventada.</text><rect x="80" y="1190" width="380" height="115" rx="4.6" data-cell="answer-shape" fill="#173C46" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="answer-kind" x="96" y="1218" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#D4E6E5">SALIDA VALIDADA</text><text data-cell="answer-title" x="96" y="1252" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#FFFFFF">Devolver respuesta</text><text data-cell="answer-body" x="96" y="1290" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">Texto, citas y modo de ejecución.</text><path d="M 270 260 L 270 340" data-cell="question-retrieve" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 270 480 L 270 555" data-cell="retrieve-evidence" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 400 612.5 L 630 615" data-cell="no-evidence" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 270 670 L 270 750" data-cell="has-evidence" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 270 885 L 270 965" data-cell="generate-validate" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 400 1022.5 L 630 1025" data-cell="invalid-answer" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 270 1080 L 270 1190" data-cell="valid-answer" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text data-cell="limit" x="590" y="229.7" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">El asistente no puede consultar</text><text data-cell="limit" x="590" y="256.3" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">la base de comercio directamente.</text><text data-cell="limit" x="590" y="282.9" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A"></text><text data-cell="limit" x="590" y="309.5" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Una cita permitida demuestra</text><text data-cell="limit" x="590" y="336.1" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">que el documento fue recuperado;</text><text data-cell="limit" x="590" y="362.7" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">no demuestra por sí sola</text><text data-cell="limit" x="590" y="389.3" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">que el texto sea fiel.</text><text data-cell="footer" x="30" y="1393.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Timeout, rechazo o fallo del proveedor también terminan en error de dependencia. SSE entrega un resultado completo validado.</text><rect data-label-for="no-evidence" x="492.493" y="601.25" width="45" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="no-evidence" data-label-for="no-evidence" x="514.993" y="622.25" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">No</text><rect data-label-for="has-evidence" x="247.5" y="697.5" width="45" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="has-evidence" data-label-for="has-evidence" x="270" y="718.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Sí</text><rect data-label-for="invalid-answer" x="492.493" y="1011.25" width="45" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="invalid-answer" data-label-for="invalid-answer" x="514.993" y="1032.25" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">No</text><rect data-label-for="valid-answer" x="247.5" y="1122.5" width="45" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="valid-answer" data-label-for="valid-answer" x="270" y="1143.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Sí</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="950" viewBox="0 0 1280 950" role="img" aria-labelledby="title"><title id="title">Observabilidad · Señales y consulta</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text data-cell="title" x="40" y="67" font-size="34" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Observabilidad · Señales y consulta</text><text data-cell="subtitle" x="40" y="108" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Vista complementaria    /    Perfil optativo de operación local</text><rect x="350" y="140" width="580" height="220" rx="3.3" data-cell="system-boundary" fill="#F5F8FA" stroke="#CBD5DF" stroke-width="1.2" stroke-dasharray="6 5"/><text data-cell="system-name" x="370" y="172.5" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#58697A">SISTEMA DE REFERENCIA · aplicaciones agrupadas</text><rect x="390" y="195" width="500" height="145" rx="5.8" data-cell="applications-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.3"/><text data-cell="applications-kind" x="408" y="226" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#1B7569">commerce-api · ai-service · order-analytics</text><text data-cell="applications-title" x="408" y="266" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Las tres aplicaciones</text><text data-cell="applications-body" x="408" y="300.1" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Comercio y asistente exportan trazas.</text><text data-cell="applications-body" x="408" y="323.9" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Las tres exponen métricas por HTTP.</text><rect x="70" y="490" width="320" height="140" rx="5.6" data-cell="collector-shape" fill="#F7F3FC" stroke="#CBD5DF" stroke-width="1.3"/><text data-cell="collector-kind" x="88" y="521" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#72549B">APOYO · OpenTelemetry Collector</text><text data-cell="collector-title" x="88" y="561" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Recepción de trazas</text><text data-cell="collector-body" x="88" y="604.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Recibe y reenvía trazas OTLP.</text><rect x="70" y="735" width="320" height="140" rx="5.6" data-cell="tempo-shape" fill="#F7F3FC" stroke="#CBD5DF" stroke-width="1.3"/><text data-cell="tempo-kind" x="88" y="766" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#72549B">APOYO · Tempo</text><text data-cell="tempo-title" x="88" y="806" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Historial de trazas</text><text data-cell="tempo-body" x="88" y="849.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Almacena trazas distribuidas.</text><rect x="890" y="490" width="320" height="140" rx="5.6" data-cell="prometheus-shape" fill="#F7F3FC" stroke="#CBD5DF" stroke-width="1.3"/><text data-cell="prometheus-kind" x="908" y="521" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#72549B">APOYO · Prometheus</text><text data-cell="prometheus-title" x="908" y="561" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Mediciones periódicas</text><text data-cell="prometheus-body" x="908" y="604.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Recoge contadores y duraciones.</text><rect x="550" y="735" width="320" height="140" rx="5.6" data-cell="grafana-shape" fill="#F7F3FC" stroke="#CBD5DF" stroke-width="1.3"/><text data-cell="grafana-kind" x="568" y="766" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#72549B">APOYO · Grafana</text><text data-cell="grafana-title" x="568" y="806" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Paneles de consulta</text><text data-cell="grafana-body" x="568" y="849.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Representa métricas y trazas.</text><path d="M 490 340 L 490 400 Q 490 410 480 410 L 240 410 Q 230 410 230 420 L 230 490" data-cell="applications-traces" fill="none" stroke="#7D8D9C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 230 630 L 230 735" data-cell="collect-traces" fill="none" stroke="#7D8D9C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1050 490 L 1050 420 Q 1050 410 1040 410 L 800 410 Q 790 410 790 400 L 790 340" data-cell="scrape-applications" fill="none" stroke="#7D8D9C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 550 805 L 390 805" data-cell="query-tempo" fill="none" stroke="#7D8D9C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 806 735 L 806 710 Q 806 700 816 700 L 1040 700 Q 1050 700 1050 690 L 1050 630" data-cell="query-prometheus" fill="none" stroke="#7D8D9C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text data-cell="footer" x="40" y="921.5" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Flecha = quien inicia la interacción. Scrape es extracción; OTLP es exportación. Los servicios de apoyo quedan fuera del límite.</text><rect data-label-for="applications-traces" x="260" y="388" width="180" height="44" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="applications-traces" data-label-for="applications-traces" x="350" y="407" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Commerce + AI</text><text data-cell="applications-traces" data-label-for="applications-traces" x="350" y="428" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Exportan · OTLP</text><rect data-label-for="collect-traces" x="145" y="669.5" width="170" height="23" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="collect-traces" data-label-for="collect-traces" x="230" y="688.5" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Reenvía · OTLP</text><rect data-label-for="scrape-applications" x="850" y="388" width="180" height="44" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="scrape-applications" data-label-for="scrape-applications" x="940" y="407" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Tres aplicaciones</text><text data-cell="scrape-applications" data-label-for="scrape-applications" x="940" y="428" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Scrape · HTTP</text><rect data-label-for="query-tempo" x="407.5" y="783" width="125" height="44" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="query-tempo" data-label-for="query-tempo" x="470" y="802" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Consulta</text><text data-cell="query-tempo" data-label-for="query-tempo" x="470" y="823" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">HTTP</text><rect data-label-for="query-prometheus" x="950" y="676" width="120" height="44" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="query-prometheus" data-label-for="query-prometheus" x="1010" y="695" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Consulta</text><text data-cell="query-prometheus" data-label-for="query-prometheus" x="1010" y="716" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">HTTP</text></svg>

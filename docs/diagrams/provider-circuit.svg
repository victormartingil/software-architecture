<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" role="img" aria-labelledby="title"><title id="title">Dejar de insistir y probar la recuperación</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text data-cell="title" x="30" y="55" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Dejar de insistir y probar la recuperación</text><text data-cell="subtitle" x="30" y="114" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Estados conceptuales del circuito implementado en OpenAIProvider · proveedor IA.</text><rect x="350" y="180" width="300" height="140" rx="5.6" data-cell="closed-shape" fill="#173C46" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="closed-kind" x="366" y="207.5" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#D4E6E5">LLAMADAS PERMITIDAS</text><text data-cell="closed-title" x="366" y="242.5" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#FFFFFF">Cerrado</text><text data-cell="closed-body" x="366" y="281.4" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">Permitir operaciones.</text><text data-cell="closed-body" x="366" y="306.6" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">Éxito válido reinicia fallos.</text><rect x="350" y="450" width="300" height="140" rx="5.6" data-cell="open-shape" fill="#FFF8E9" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="open-kind" x="366" y="477.5" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#58697A">PROTECCIÓN ACTIVA</text><text data-cell="open-title" x="366" y="512.5" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Abierto</text><text data-cell="open-body" x="366" y="551.4" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Rechazar nuevas operaciones.</text><text data-cell="open-body" x="366" y="576.6" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Esperar treinta segundos.</text><rect x="350" y="740" width="300" height="140" rx="5.6" data-cell="probe-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="probe-kind" x="366" y="767.5" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#58697A">HALF-OPEN</text><text data-cell="probe-title" x="366" y="802.5" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Prueba de recuperación</text><text data-cell="probe-body" x="366" y="841.4" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Permitir una operación.</text><text data-cell="probe-body" x="366" y="866.6" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Las demás se rechazan.</text><polyline points="500,320 500,450" data-cell="trip" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="500,590 500,740" data-cell="next-call" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="350,810 100,810 100,250 350,250" data-cell="recover" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="650,810 900,810 900,520 650,520" data-cell="reopen" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text data-cell="footer" x="30" y="969.7" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Una operación admite hasta dos intentos HTTP transitorios dentro de su presupuesto.</text><text data-cell="footer" x="30" y="993.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">La desconexión del cliente libera capacidad y no suma un fallo al proveedor.</text><text data-cell="footer" x="30" y="1017.3" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Una respuesta de una época anterior no modifica el circuito actual.</text><rect data-label-for="trip" x="365" y="372" width="270" height="26" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="trip" data-label-for="trip" x="500" y="394" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Tres fallos de operación</text><rect data-label-for="next-call" x="350" y="639.4" width="300" height="51.2" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="next-call" data-label-for="next-call" x="500" y="661.4" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Tras 30 s, siguiente llamada</text><text data-cell="next-call" data-label-for="next-call" x="500" y="686.6" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">reserva la única prueba</text><rect data-label-for="recover" x="10" y="504.4" width="180" height="51.2" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="recover" data-label-for="recover" x="100" y="526.4" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Respuesta completa</text><text data-cell="recover" data-label-for="recover" x="100" y="551.6" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">válida: cerrar</text><rect data-label-for="reopen" x="810" y="639.4" width="180" height="51.2" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="reopen" data-label-for="reopen" x="900" y="661.4" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Fallo, timeout</text><text data-cell="reopen" data-label-for="reopen" x="900" y="686.6" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">o salida inválida</text></svg>

" stroke-width="1.3"/><text data-cell="node-identity-title" x="118" y="811.5" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Identidad de nodos</text><text data-cell="node-identity-body" x="118" y="847.9" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Rol mínimo GKE + lectura acotada del registro.</text><text data-cell="node-identity-body" x="118" y="873.1" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Permisos Workload Identity de apps: pendientes.</text><rect x="750" y="980" width="280" height="100" rx="2.5" data-cell="internet-shape" fill="#F7F3FC" stroke="#CBD5DF" stroke-width="1.3"/><text data-cell="internet-title" x="768" y="1021.5" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Internet</text><text data-cell="internet-body" x="768" y="1060.5" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Destino de salida NAT.</text><path d="M 300 232.5 L 420 232.5" data-cell="operator-control" fill="none" stroke="#7D8D9C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 585 305 L 568 510" data-cell="control-nodes" fill="none" stroke="#7D8D9C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 620 589.8 L 750 590" data-cell="nodes-nat" fill="none" stroke="#7D8D9C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 890 670 L 890 980" data-cell="nat-internet" fill="none" stroke="#7D8D9C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 620 540.4 L 680 540.4 Q 690 540.4 690 530.4 L 690 375 Q 690 365 700 365 L 965 365 Q 975 365 975 355 L 975 305" data-cell="nodes-registry" fill="none" stroke="#7D8D9C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text data-cell="cloud-pending" x="40" y="1145" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">BD, Kafka, OIDC, DNS/TLS y secretos: dependencias externas o trabajo de despliegue pendiente.</text><text data-cell="cloud-limit" x="40" y="1184" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">El plan mock no acredita conectividad, cuotas, IAM efectivo, costes ni disponibilidad cloud.</text><rect data-label-for="operator-control" x="310" y="219.5" width="100" height="26" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="operator-control" data-label-for="operator-control" x="360" y="241.5" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">API /32</text><rect data-label-for="control-nodes" x="499.005" y="394.234" width="145" height="26" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="control-nodes" data-label-for="control-nodes" x="571.505" y="416.234" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Gestión GKE</text><rect data-label-for="nodes-nat" x="637.5" y="576.9" width="95" height="26" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="nodes-nat" data-label-for="nodes-nat" x="685" y="598.9" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Salida</text><rect data-label-for="nat-internet" x="840" y="812" width="100" height="26" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="nat-internet" data-label-for="nat-internet" x="890" y="834" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="mi
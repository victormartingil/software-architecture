Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#FFFFFF">Pods de aplicación</text><text data-cell="kind-apps-body" x="628" y="638.9" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">Commerce · HPA 1–2 réplicas</text><text data-cell="kind-apps-body" x="628" y="665.5" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">AI · 1 réplica, Recreate</text><text data-cell="kind-apps-body" x="628" y="692.1" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">Streams · 1 réplica, Recreate</text><rect x="610" y="780" width="440" height="160" rx="4" data-cell="kind-deps-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.3"/><text data-cell="kind-deps-kind" x="628" y="811.5" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#1B7569">RECURSOS DEL NAMESPACE</text><text data-cell="kind-deps-title" x="628" y="851.5" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Datos e identidad</text><text data-cell="kind-deps-body" x="628" y="892.2" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">StatefulSets: PostgreSQL y Kafka</text><text data-cell="kind-deps-body" x="628" y="918.8" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Deployment: Keycloak</text><rect x="610" y="990" width="440" height="130" rx="3.25" data-cell="kind-storage-shape" fill="#FFF8E9" stroke="#CBD5DF" stroke-width="1.3"/><text data-cell="kind-storage-title" x="628" y="1031.5" font-size="25" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">PVC dentro del clúster</text><text data-cell="kind-storage-body" x="628" y="1072.9" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Postgres · Kafka</text><text data-cell="kind-storage-body" x="628" y="1098.1" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">SQLite → AI · RocksDB → Streams</text><path d="M 830 455 L 830 520" data-cell="kind-ingress" fill="none" stroke="#7D8D9C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text data-cell="local-signals" x="55" y="1173.5" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Señales completas: perfil optativo de Compose; no se instalan en kind.</text><text data-cell="local-lifecycle" x="40" y="1259" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Compose down conserva volúmenes. kind-down elimina el nodo y sus datos.</text><text data-cell="local-limit" x="40" y="1298" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Comparación de configuración local; las conexiones entre servicios están en el C4.</text><rect data-label-for="compose-ingress" x="245" y="475" width="90" height="26" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="compose-ingress" data-label-for="compose-ingress" x="290" y="497" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">HTTP</text><rect data-label-for="kind-ingress" x="785" y="475" width="90" height="26" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="kind-ingress" data-label-for="kind-ingress" x="830" y="497" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">HTTP</text></svg>

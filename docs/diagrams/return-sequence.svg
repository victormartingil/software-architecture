<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1510" viewBox="0 0 1100 1510" role="img" aria-labelledby="title"><title id="title">Devolución con aprobación humana</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text data-cell="title" x="30" y="57.5" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Devolución con aprobación humana</text><text data-cell="subtitle" x="30" y="109" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Secuencia    —    El asistente coordina; Comercio autoriza y confirma el cambio de negocio.</text><rect x="35" y="145" width="180" height="90" rx="3.6" data-cell="user-header" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.2"/><text data-cell="user-title" x="125" y="180.5" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">Comprador</text><text data-cell="user-body" x="125" y="215.5" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">CUSTOMER</text><rect x="124.5" y="235" width="1" height="1185" rx="0" data-cell="user-lifeline" fill="#CBD5DF" stroke="none" stroke-width="1.2"/><rect x="320" y="145" width="180" height="90" rx="3.6" data-cell="assistant-header" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.2"/><text data-cell="assistant-title" x="410" y="180.5" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">Asistente</text><text data-cell="assistant-body" x="410" y="215.5" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">ai-service</text><rect x="409.5" y="235" width="1" height="1185" rx="0" data-cell="assistant-lifeline" fill="#CBD5DF" stroke="none" stroke-width="1.2"/><rect x="610" y="145" width="180" height="90" rx="3.6" data-cell="commerce-header" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.2"/><text data-cell="commerce-title" x="700" y="180.5" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">Comercio</text><text data-cell="commerce-body" x="700" y="215.5" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">commerce-api</text><rect x="699.5" y="235" width="1" height="1185" rx="0" data-cell="commerce-lifeline" fill="#CBD5DF" stroke="none" stroke-width="1.2"/><rect x="895" y="145" width="180" height="90" rx="3.6" data-cell="manager-header" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.2"/><text data-cell="manager-title" x="985" y="180.5" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">Responsable</text><text data-cell="manager-body" x="985" y="215.5" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">MANAGER</text><rect x="984.5" y="235" width="1" height="1185" rx="0" data-cell="manager-lifeline" fill="#CBD5DF" stroke="none" stroke-width="1.2"/><path d="M 125 290 L 410 290" data-cell="propose" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 410 380 L 700 380" data-cell="create-proposal" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 700 470 L 410 470" data-cell="proposal" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M 410 550 L 520 550 Q 530 550 530 560 L 530 605 Q 530 615 520 615 L 410 615" data-cell="pause" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 985 710 L 410 710" data-cell="approve-request" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 410 810 L 700 810" data-cell="read-current" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 410 900 L 700 900" data-cell="approve-version" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 700 985 L 410 985" data-cell="new-version" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M 410 1110 L 700 1110" data-cell="execute" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 700 1200 L 810 1200 Q 820 1200 820 1210 L 820 1255 Q 820 1265 810 1265 L 700 1265" data-cell="check" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 700 1340 L 410 1340" data-cell="result" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text data-cell="footer" x="30" y="1473.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">El checkpoint se actualiza a EXECUTED; nunca guarda JWT. Si la propuesta ya está ejecutada, se devuelve el estado sin repetir el efecto.</text><rect data-label-for="propose" x="148" y="240.6" width="240" height="48.8" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="propose" data-label-for="propose" x="268" y="261.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Solicitar propuesta</text><text data-cell="propose" data-label-for="propose" x="268" y="285.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">+ clave idempotente</text><rect data-label-for="create-proposal" x="435" y="330.6" width="240" height="48.8" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="create-proposal" data-label-for="create-proposal" x="555" y="351.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Crear propuesta</text><text data-cell="create-proposal" data-label-for="create-proposal" x="555" y="375.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">JWT del comprador</text><rect data-label-for="proposal" x="435" y="470.6" width="240" height="48.8" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="proposal" data-label-for="proposal" x="555" y="491.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Propuesta PENDING</text><text data-cell="proposal" data-label-for="proposal" x="555" y="515.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">returnId y versión</text><rect data-label-for="pause" x="427.5" y="558.6" width="225" height="48.8" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="pause" data-label-for="pause" x="540" y="579.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Guardar progreso</text><text data-cell="pause" data-label-for="pause" x="540" y="603.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">y esperar aprobación</text><rect data-label-for="approve-request" x="577" y="710.6" width="240" height="48.8" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="approve-request" data-label-for="approve-request" x="697" y="731.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Aprobar con JWT actual</text><text data-cell="approve-request" data-label-for="approve-request" x="697" y="755.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Mismo tenant y rol MANAGER</text><rect data-label-for="read-current" x="435" y="772.5" width="240" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="read-current" data-label-for="read-current" x="555" y="793.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Consultar estado y versión</text><rect data-label-for="approve-version" x="435" y="862.5" width="240" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="approve-version" data-label-for="approve-version" x="555" y="883.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Aprobar versión actual</text><rect data-label-for="new-version" x="435" y="985.6" width="240" height="48.8" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="new-version" data-label-for="new-version" x="555" y="1006.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Versión aprobada</text><text data-cell="new-version" data-label-for="new-version" x="555" y="1030.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">y vencimiento</text><rect data-label-for="execute" x="435" y="1060.6" width="240" height="48.8" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="execute" data-label-for="execute" x="555" y="1081.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Ejecutar con versión</text><text data-cell="execute" data-label-for="execute" x="555" y="1105.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">y clave execute:returnId</text><rect data-label-for="check" x="717.5" y="1208.6" width="225" height="48.8" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="check" data-label-for="check" x="830" y="1229.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Revalidar y confirmar</text><text data-cell="check" data-label-for="check" x="830" y="1253.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">pedido + stock + devolución</text><rect data-label-for="result" x="435" y="1352.5" width="240" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="result" data-label-for="result" x="555" y="1373.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Resultado único</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1070" viewBox="0 0 1100 1070" role="img" aria-labelledby="title"><title id="title">Del HTTP al negocio y a SQL</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text data-cell="title" x="30" y="57.5" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Del HTTP al negocio y a SQL</text><text data-cell="subtitle" x="30" y="109" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Componentes de código dentro de commerce-api    —    Una caja no equivale a otro servicio.</text><rect x="45" y="170" width="300" height="150" rx="6" data-cell="http-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="http-kind" x="61" y="198" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#58697A">ADAPTADOR DE ENTRADA</text><text data-cell="http-title" x="61" y="232" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Entrada HTTP</text><text data-cell="http-body" x="61" y="287.5" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">CommerceController</text><rect x="440" y="170" width="300" height="150" rx="6" data-cell="input-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="input-kind" x="456" y="198" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#58697A">PUERTO DE ENTRADA</text><text data-cell="input-title" x="456" y="232" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Operaciones de pedidos</text><text data-cell="input-body" x="456" y="287.5" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">OrderUseCase</text><rect x="440" y="440" width="300" height="150" rx="6" data-cell="usecase-shape" fill="#173C46" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="usecase-kind" x="456" y="468" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#D4E6E5">CASO DE USO</text><text data-cell="usecase-title" x="456" y="502" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#FFFFFF">Crear un pedido</text><text data-cell="usecase-body" x="456" y="557.5" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">ManageOrderService</text><rect x="805" y="440" width="250" height="150" rx="6" data-cell="domain-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="domain-kind" x="821" y="468" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#58697A">DOMINIO</text><text data-cell="domain-title" x="821" y="502" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Pedido</text><text data-cell="domain-body" x="821" y="557.5" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Order</text><rect x="440" y="730" width="300" height="150" rx="6" data-cell="output-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="output-kind" x="456" y="758" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#58697A">PUERTO DE SALIDA</text><text data-cell="output-title" x="456" y="792" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Persistir pedidos</text><text data-cell="output-body" x="456" y="847.5" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">OrderRepository</text><rect x="45" y="730" width="300" height="150" rx="6" data-cell="jdbc-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="jdbc-kind" x="61" y="758" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#58697A">ADAPTADOR DE SALIDA</text><text data-cell="jdbc-title" x="61" y="792" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Acceso SQL</text><text data-cell="jdbc-body" x="61" y="847.5" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">JdbcOrderRepositoryAdapter</text><rect x="45" y="940" width="300" height="90" rx="3.6" data-cell="db-shape" fill="#FFF8E9" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="db-title" x="61" y="979" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Datos de comercio</text><text data-cell="db-body" x="61" y="1015.5" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">PostgreSQL</text><path d="M 345 245 L 440 245" data-cell="http-input" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 590 440 L 590 320" data-cell="usecase-input" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M 740 515 L 805 515" data-cell="usecase-domain" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 590 590 L 590 730" data-cell="usecase-output" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 345 805 L 440 805" data-cell="jdbc-output" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M 195 880 L 195 940" data-cell="jdbc-db" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text data-cell="dependency-note" x="45" y="471" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Las flechas entre clases</text><text data-cell="dependency-note" x="45" y="496.2" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">indican dependencia de código.</text><text data-cell="dependency-note" x="45" y="521.4" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A"></text><text data-cell="dependency-note" x="45" y="546.6" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">En ejecución, el caso de uso</text><text data-cell="dependency-note" x="45" y="571.8" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">llama al adaptador a través</text><text data-cell="dependency-note" x="45" y="597" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">del puerto OrderRepository.</text><text data-cell="footer" x="410" y="991.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">El dominio no importa Spring ni JDBC.</text><text data-cell="footer" x="410" y="1015.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">La implementación se conecta al puerto mediante inyección.</text><rect data-label-for="http-input" x="358" y="232.5" width="70" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="http-input" data-label-for="http-input" x="393" y="253.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Invoca</text><rect data-label-for="usecase-input" x="535" y="367.5" width="110" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="usecase-input" data-label-for="usecase-input" x="590" y="388.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Implementa</text><rect data-label-for="usecase-domain" x="745.5" y="502.5" width="55" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="usecase-domain" data-label-for="usecase-domain" x="773" y="523.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Usa</text><rect data-label-for="usecase-output" x="537.5" y="647.5" width="105" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="usecase-output" data-label-for="usecase-output" x="590" y="668.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Depende de</text><rect data-label-for="jdbc-output" x="340.5" y="792.5" width="105" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="jdbc-output" data-label-for="jdbc-output" x="393" y="813.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Implementa</text><rect data-label-for="jdbc-db" x="170" y="897.5" width="50" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="jdbc-db" data-label-for="jdbc-db" x="195" y="918.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">SQL</text></svg>

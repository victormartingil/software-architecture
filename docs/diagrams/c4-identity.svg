<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img" aria-labelledby="title"><title id="title">Identidad · Tokens y validación local</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text data-cell="title" x="40" y="67" font-size="34" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Identidad · Tokens y validación local</text><text data-cell="subtitle" x="40" y="108" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Vista complementaria    /    Sistemas de apoyo fuera del límite funcional</text><rect x="660" y="155" width="380" height="140" rx="5.6" data-cell="identity-shape" fill="#F7F3FC" stroke="#CBD5DF" stroke-width="1.3"/><text data-cell="identity-kind" x="678" y="186" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#72549B">SERVIDOR INDEPENDIENTE · Keycloak</text><text data-cell="identity-title" x="678" y="226" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Servidor de identidad</text><text data-cell="identity-body" x="678" y="257.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Comprueba credenciales y emite tokens.</text><text data-cell="identity-body" x="678" y="281.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Publica claves para verificar su firma.</text><rect x="60" y="155" width="330" height="140" rx="5.6" data-cell="clients-shape" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.3"/><text data-cell="clients-kind" x="78" y="186" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#28609A">CONSUMIDORES DE NUESTRAS APIs</text><text data-cell="clients-title" x="78" y="226" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Scripts de prueba</text><text data-cell="clients-body" x="78" y="269.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Solicitan un token como usuario.</text><rect x="32" y="445" width="1036" height="235" rx="3.525" data-cell="system-boundary" fill="#F5F8FA" stroke="#CBD5DF" stroke-width="1.2" stroke-dasharray="6 5"/><text data-cell="system-name" x="52" y="477.5" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#58697A">SISTEMA DE REFERENCIA · APIs</text><rect x="60" y="505" width="380" height="145" rx="5.8" data-cell="commerce-shape" fill="#173C46" stroke="#173C46" stroke-width="1.3"/><text data-cell="commerce-kind" x="78" y="536" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#D4E6E5">commerce-api · Java / Spring</text><text data-cell="commerce-title" x="78" y="576" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#FFFFFF">API de comercio</text><text data-cell="commerce-body" x="78" y="622" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">Comprueba token y permisos localmente.</text><rect x="660" y="505" width="380" height="145" rx="5.8" data-cell="ai-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.3"/><text data-cell="ai-kind" x="678" y="536" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#1B7569">ai-service · Python / FastAPI</text><text data-cell="ai-title" x="678" y="576" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">API del asistente</text><text data-cell="ai-body" x="678" y="622" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Comprueba token y permisos localmente.</text><path d="M 390 225 L 660 225" data-cell="token-request" fill="none" stroke="#7D8D9C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 326 505 L 326 375 Q 326 365 336 365 L 756.4 365 Q 766.4 365 766.4 355 L 766.4 295" data-cell="commerce-jwks" fill="none" stroke="#7D8D9C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 964 505 L 964 295" data-cell="ai-jwks" fill="none" stroke="#7D8D9C" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow)"/><text data-cell="footer" x="40" y="751" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Keycloak es otro proceso, no un módulo de Spring. Las APIs comprueban el JWT con claves públicas almacenadas en caché.</text><rect data-label-for="token-request" x="420" y="203" width="200" height="44" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="token-request" data-label-for="token-request" x="520" y="222" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Solicita un token firmado</text><text data-cell="token-request" data-label-for="token-request" x="520" y="243" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Protocolo OIDC · HTTP local</text><rect data-label-for="commerce-jwks" x="390" y="341" width="230" height="44" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="commerce-jwks" data-label-for="commerce-jwks" x="505" y="360" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Descarga claves de firma</text><text data-cell="commerce-jwks" data-label-for="commerce-jwks" x="505" y="381" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Formato JWKS · HTTP local</text><rect data-label-for="ai-jwks" x="854" y="374" width="220" height="44" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="ai-jwks" data-label-for="ai-jwks" x="964" y="393" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Descarga claves de firma</text><text data-cell="ai-jwks" data-label-for="ai-jwks" x="964" y="414" font-size="15" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Formato JWKS · HTTP local</text></svg>

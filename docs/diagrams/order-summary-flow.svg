<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1370" viewBox="0 0 980 1370" role="img" aria-labelledby="title"><title id="title">Cómo se resume un pedido creado</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text data-cell="title" x="30" y="57.5" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Cómo se resume un pedido creado</text><text data-cell="subtitle" x="30" y="109" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Kafka entrega eventos; Streams los procesa. No calcula ventas netas ni descuenta devoluciones.</text><rect x="90" y="150" width="340" height="115" rx="4.6" data-cell="input-shape" fill="#FFF8E9" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="input-title" x="106" y="189" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Evento de pedido</text><text data-cell="input-body" x="106" y="238" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">orders.placed.v1</text><polygon points="260,335 390,392.5 260,450 130,392.5" data-cell="valid-shape" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="valid-text" x="260" y="388.7" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">¿Contrato</text><text data-cell="valid-text" x="260" y="415.3" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">válido?</text><rect x="610" y="335" width="300" height="115" rx="4.6" data-cell="invalid-shape" fill="#FFF8E9" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="invalid-title" x="626" y="374" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Mensaje inválido</text><text data-cell="invalid-body" x="626" y="423" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Enviar a topic de errores (DLT).</text><polygon points="260,535 390,592.5 260,650 130,592.5" data-cell="duplicate-shape" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="duplicate-text" x="260" y="588.7" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">¿eventId</text><text data-cell="duplicate-text" x="260" y="615.3" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">repetido?</text><rect x="610" y="535" width="300" height="115" rx="4.6" data-cell="discard-duplicate-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="discard-duplicate-title" x="626" y="574" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Descartar duplicado</text><text data-cell="discard-duplicate-body" x="626" y="623" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Identidades retenidas siete días.</text><polygon points="260,735 390,792.5 260,850 130,792.5" data-cell="late-shape" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="late-text" x="260" y="788.7" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">¿Demasiado</text><text data-cell="late-text" x="260" y="815.3" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">tarde?</text><rect x="610" y="735" width="300" height="115" rx="4.6" data-cell="discard-late-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="discard-late-title" x="626" y="774" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Contar y descartar</text><text data-cell="discard-late-body" x="626" y="823" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Respecto al tiempo de eventos.</text><rect x="90" y="935" width="340" height="125" rx="5" data-cell="aggregate-shape" fill="#173C46" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="aggregate-kind" x="106" y="963" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#D4E6E5">PROCESADOR · KAFKA STREAMS</text><text data-cell="aggregate-title" x="106" y="997" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#FFFFFF">Acumular por minuto</text><text data-cell="aggregate-body" x="106" y="1027.4" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">Organización y producto.</text><text data-cell="aggregate-body" x="106" y="1052.6" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">Tolerancia: treinta segundos.</text><rect x="90" y="1150" width="340" height="115" rx="4.6" data-cell="output-shape" fill="#FFF8E9" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="output-title" x="106" y="1189" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Actualizar resumen</text><text data-cell="output-body" x="106" y="1238" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">orders.summary.v1</text><path d="M 260 265 L 260 335" data-cell="input-valid" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 390 392.5 L 610 392.5" data-cell="invalid-route" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 260 450 L 260 535" data-cell="valid-duplicate" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 390 592.5 L 610 592.5" data-cell="duplicate-route" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 260 650 L 260 735" data-cell="unique-late" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 390 792.5 L 610 792.5" data-cell="late-route" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 260 850 L 260 935" data-cell="on-time" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 260 1060 L 260 1150" data-cell="summary" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text data-cell="meaning" x="530" y="1016" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Ejemplo: dos pedidos de BOOK-1</text><text data-cell="meaning" x="530" y="1044" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">en el mismo minuto actualizan</text><text data-cell="meaning" x="530" y="1072" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">el mismo resumen.</text><text data-cell="meaning" x="530" y="1100" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A"></text><text data-cell="meaning" x="530" y="1128" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">La salida es una actualización:</text><text data-cell="meaning" x="530" y="1156" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">no debe sumarse otra vez</text><text data-cell="meaning" x="530" y="1184" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">como si fuera otro pedido.</text><text data-cell="footer" x="30" y="1333.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">RocksDB guarda el estado local; los changelogs de Kafka permiten reconstruirlo. No son un almacén ajeno de Comercio.</text><rect data-label-for="invalid-route" x="477.5" y="380" width="45" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="invalid-route" data-label-for="invalid-route" x="500" y="401" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">No</text><rect data-label-for="valid-duplicate" x="237.5" y="480.5" width="45" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="valid-duplicate" data-label-for="valid-duplicate" x="260" y="501.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Sí</text><rect data-label-for="duplicate-route" x="477.5" y="580" width="45" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="duplicate-route" data-label-for="duplicate-route" x="500" y="601" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Sí</text><rect data-label-for="unique-late" x="237.5" y="680.5" width="45" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="unique-late" data-label-for="unique-late" x="260" y="701.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">No</text><rect data-label-for="late-route" x="477.5" y="780" width="45" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="late-route" data-label-for="late-route" x="500" y="801" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Sí</text><rect data-label-for="on-time" x="237.5" y="880.5" width="45" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="on-time" data-label-for="on-time" x="260" y="901.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">No</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" role="img" aria-labelledby="title"><title id="title">Dos compras y la última unidad</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text data-cell="title" x="30" y="55" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Dos compras y la última unidad</text><text data-cell="subtitle" x="30" y="114" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Intercalación posible en PostgreSQL · claves idempotentes distintas · stock inicial = 1.</text><rect x="60" y="140" width="240" height="90" rx="3.6" data-cell="a-shape" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="a-title" x="180" y="176" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">Transacción A</text><text data-cell="a-body" x="180" y="212" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Compra con clave A</text><polyline points="180,230 180,710" data-cell="a-lifeline" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/><rect x="390" y="140" width="240" height="90" rx="3.6" data-cell="db-shape" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="db-title" x="510" y="176" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">Fila de inventario</text><text data-cell="db-body" x="510" y="212" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">PostgreSQL · stock = 1</text><polyline points="510,230 510,930" data-cell="db-lifeline" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/><rect x="700" y="140" width="240" height="90" rx="3.6" data-cell="b-shape" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="b-title" x="820" y="176" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">Transacción B</text><text data-cell="b-body" x="820" y="212" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Compra con clave B</text><polyline points="820,230 820,870" data-cell="b-lifeline" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/><rect x="502" y="295" width="16" height="395" rx="0" data-cell="row-lock" fill="#FFF8E9" stroke="#CBD5DF" stroke-width="1"/><polyline points="180,295 510,295" data-cell="reserve-a" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="510,365 180,365" data-cell="reserved-a" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="820,440 510,440" data-cell="reserve-b" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text data-cell="wait-b" x="550" y="518.9" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#916623">B espera el bloqueo</text><text data-cell="wait-b" x="550" y="544.1" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#916623">de A.</text><polyline points="180,615 510,615" data-cell="commit-a" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="510,690 180,690" data-cell="committed-a" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text data-cell="accepted" x="45" y="768.9" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#1B7569">API A devuelve 201.</text><text data-cell="accepted" x="45" y="794.1" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#1B7569">Stock confirmado = 0.</text><polyline points="510,765 820,765" data-cell="reject-b" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><polyline points="820,850 510,850" data-cell="rollback-b" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text data-cell="conflict" x="690" y="919" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#916623">API B devuelve 409.</text><text data-cell="footer" x="30" y="997.2" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">La primera actualización que obtiene la fila y confirma puede ganar: A o B.</text><text data-cell="footer" x="30" y="1021" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Si la primera transacción revierte, la otra puede reservar. El diagrama dibuja un commit.</text><text data-cell="footer" x="30" y="1044.8" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">La guarda SQL, las escrituras de negocio y la idempotencia se coordinan en la transacción.</text><rect data-label-for="reserve-a" x="205" y="234.4" width="280" height="51.2" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="reserve-a" data-label-for="reserve-a" x="345" y="256.4" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">UPDATE stock = stock − 1</text><text data-cell="reserve-a" data-label-for="reserve-a" x="345" y="281.6" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">WHERE stock &gt;= 1</text><rect data-label-for="reserved-a" x="205" y="322" width="280" height="26" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="reserved-a" data-label-for="reserved-a" x="345" y="344" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">1 fila actualizada · precio</text><rect data-label-for="reserve-b" x="525" y="384.4" width="280" height="51.2" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="reserve-b" data-label-for="reserve-b" x="665" y="406.4" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">UPDATE stock = stock − 1</text><text data-cell="reserve-b" data-label-for="reserve-b" x="665" y="431.6" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">WHERE stock &gt;= 1</text><rect data-label-for="commit-a" x="205" y="554.4" width="280" height="51.2" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="commit-a" data-label-for="commit-a" x="345" y="576.4" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Guardar pedido, outbox</text><text data-cell="commit-a" data-label-for="commit-a" x="345" y="601.6" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">y resultado · COMMIT</text><rect data-label-for="committed-a" x="205" y="647" width="280" height="26" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="committed-a" data-label-for="committed-a" x="345" y="669" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Commit confirmado</text><rect data-label-for="reject-b" x="525" y="704.4" width="280" height="51.2" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="reject-b" data-label-for="reject-b" x="665" y="726.4" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">WHERE se reevalúa: stock = 0</text><text data-cell="reject-b" data-label-for="reject-b" x="665" y="751.6" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">0 filas actualizadas</text><rect data-label-for="rollback-b" x="525" y="807" width="280" height="26" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="rollback-b" data-label-for="rollback-b" x="665" y="829" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">ROLLBACK por conflicto</text></svg>

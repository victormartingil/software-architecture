<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="1300" viewBox="0 0 1220 1300" role="img" aria-labelledby="title"><title id="title">Estados de una devolución</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text data-cell="title" x="30" y="57.5" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Estados de una devolución</text><text data-cell="subtitle" x="30" y="109" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Estado de negocio en Comercio    —    Los nombres ingleses son los valores reales de la API.</text><ellipse cx="490" cy="160" rx="10" ry="10" data-cell="start-dot" fill="#173C46" stroke="#173C46" stroke-width="1.2"/><rect x="290" y="270" width="400" height="125" rx="5" data-cell="pending-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="pending-title" x="306" y="309" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Pendiente de aprobación</text><text data-cell="pending-body" x="306" y="363" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">PENDING · propuesta creada.</text><rect x="290" y="560" width="400" height="125" rx="5" data-cell="approved-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="approved-title" x="306" y="599" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Aprobada</text><text data-cell="approved-body" x="306" y="653" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">APPROVED · versión y vencimiento.</text><rect x="290" y="850" width="400" height="125" rx="5" data-cell="executed-shape" fill="#173C46" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="executed-title" x="306" y="889" font-size="22" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#FFFFFF">Ejecutada</text><text data-cell="executed-body" x="306" y="943" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">EXECUTED · pedido devuelto y stock repuesto.</text><path d="M 490 170 L 490 270" data-cell="created" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 490 395 L 490 560" data-cell="approve" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 490 685 L 490 850" data-cell="execute" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 690 597.5 L 900 597.023 Q 910 597 910 607 L 910 638 Q 910 648 900 647.977 L 690 647.5" data-cell="renew" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text data-cell="idempotence" x="40" y="1131.2" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Un conflicto o vencimiento rechaza la operación: no crea un estado EXPIRED.</text><text data-cell="idempotence" x="40" y="1157.8" font-size="19" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Una repetición idempotente recupera el resultado anterior y conserva el estado.</text><text data-cell="footer" x="30" y="1263.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">El asistente añade checkpoints de coordinación; no sustituye estas transiciones transaccionales de Comercio.</text><rect data-label-for="created" x="410" y="207.5" width="160" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="created" data-label-for="created" x="490" y="228.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Crear propuesta</text><rect data-label-for="approve" x="370" y="465.5" width="240" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="approve" data-label-for="approve" x="490" y="486.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">MANAGER + versión actual</text><rect data-label-for="execute" x="375" y="743.6" width="230" height="48.8" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="execute" data-label-for="execute" x="490" y="764.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Versión aprobada</text><text data-cell="execute" data-label-for="execute" x="490" y="788.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">y aprobación no vencida</text><rect data-label-for="renew" x="770" y="598.599" width="280" height="48.8" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="renew" data-label-for="renew" x="910" y="619.599" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Nueva aprobación explícita</text><text data-cell="renew" data-label-for="renew" x="910" y="643.399" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Incrementa versión; renueva plazo</text></svg>

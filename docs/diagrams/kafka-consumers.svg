<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1080" viewBox="0 0 960 1080" role="img" aria-labelledby="title"><title id="title">Un evento, dos lectores independientes</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text data-cell="title" x="30" y="55" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Un evento, dos lectores independientes</text><text data-cell="subtitle" x="30" y="114" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Kafka conserva registros; Kafka Streams es una biblioteca dentro de una aplicación.</text><rect x="310" y="145" width="340" height="120" rx="4.8" data-cell="producer-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="producer-kind" x="326" y="172.5" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#58697A">PRODUCTOR</text><text data-cell="producer-title" x="326" y="207.5" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Publicar pedido</text><text data-cell="producer-body" x="326" y="249" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">commerce-api · publicador outbox</text><rect x="60" y="350" width="840" height="140" rx="5.6" data-cell="topic-shape" fill="#FFF8E9" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="topic-kind" x="76" y="377.5" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#58697A">TOPIC EN EL SERVIDOR KAFKA</text><text data-cell="topic-title" x="76" y="412.5" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">orders.placed.v1</text><text data-cell="topic-body" x="76" y="451.4" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Tres particiones · clave orderId</text><text data-cell="topic-body" x="76" y="476.6" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">El orden de escritura se conserva dentro de cada partición.</text><rect x="40" y="620" width="390" height="155" rx="6.2" data-cell="audit-shape" fill="#FFFFFF" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="audit-kind" x="56" y="647.5" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#58697A">DENTRO DE commerce-api</text><text data-cell="audit-title" x="56" y="682.5" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Auditar el evento</text><text data-cell="audit-body" x="56" y="728.9" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Listener Kafka + Inbox</text><text data-cell="audit-body" x="56" y="754.1" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Deduplicación por eventId.</text><rect x="530" y="620" width="390" height="155" rx="6.2" data-cell="streams-shape" fill="#173C46" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="streams-kind" x="546" y="647.5" font-size="14" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#D4E6E5">PROCESO · order-analytics</text><text data-cell="streams-title" x="546" y="682.5" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#FFFFFF">Resumir por minuto</text><text data-cell="streams-body" x="546" y="728.9" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">Biblioteca Kafka Streams</text><text data-cell="streams-body" x="546" y="754.1" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#D4E6E5">Topología + estado local RocksDB.</text><rect x="40" y="880" width="390" height="110" rx="4.4" data-cell="inbox-shape" fill="#FFF8E9" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="inbox-title" x="56" y="919.5" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Auditoría persistida</text><text data-cell="inbox-body" x="56" y="966" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">PostgreSQL · efecto + identidad</text><rect x="530" y="880" width="390" height="110" rx="4.4" data-cell="summary-shape" fill="#FFF8E9" stroke="#CBD5DF" stroke-width="1.5"/><text data-cell="summary-title" x="546" y="919.5" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">orders.summary.v1</text><text data-cell="summary-body" x="546" y="966" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Kafka · actualizaciones del resumen</text><polyline points="480,265 480,350" data-cell="publish" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="236.4,490 236.4,555 235,555 235,620" data-cell="group-audit" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="723.6,490 723.6,555 725,555 725,620" data-cell="group-streams" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="235,775 235,880" data-cell="effect" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="725,775 725,880" data-cell="update" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text data-cell="footer" x="30" y="1036.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Cada grupo conserva su propia posición de lectura. Leer no elimina registros.</text><text data-cell="footer" x="30" y="1060.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Se omiten topics internos de reparticionado/changelog y las rutas de error.</text><rect data-label-for="publish" x="355" y="295" width="250" height="26" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="publish" data-label-for="publish" x="480" y="317" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Publicar OrderPlaced</text><rect data-label-for="group-audit" x="130" y="541.6" width="210" height="26" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="group-audit" data-label-for="group-audit" x="235" y="563.6" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Grupo auditoría</text><rect data-label-for="group-streams" x="620" y="541.6" width="210" height="26" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="group-streams" data-label-for="group-streams" x="725" y="563.6" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Grupo Analytics</text><rect data-label-for="effect" x="140" y="815" width="190" height="26" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="effect" data-label-for="effect" x="235" y="837" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Guardar efecto</text><rect data-label-for="update" x="600" y="815" width="250" height="26" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="update" data-label-for="update" x="725" y="837" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Publicar actualización</text></svg>

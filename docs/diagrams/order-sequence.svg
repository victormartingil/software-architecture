<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1300" viewBox="0 0 1120 1300" role="img" aria-labelledby="title"><title id="title">Crear un pedido sin perder su evento</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text data-cell="title" x="30" y="57.5" font-size="30" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#182D43">Crear un pedido sin perder su evento</text><text data-cell="subtitle" x="30" y="109" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Secuencia    —    La transacción SQL y la entrega a Kafka ocurren en momentos distintos.</text><rect x="15" y="145" width="180" height="90" rx="3.6" data-cell="user-header" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.2"/><text data-cell="user-title" x="105" y="180.5" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">Cliente HTTP</text><text data-cell="user-body" x="105" y="215.5" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Script local</text><rect x="104.5" y="235" width="1" height="975" rx="0" data-cell="user-lifeline" fill="#CBD5DF" stroke="none" stroke-width="1.2"/><rect x="245" y="145" width="180" height="90" rx="3.6" data-cell="commerce-header" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.2"/><text data-cell="commerce-title" x="335" y="180.5" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">Comercio</text><text data-cell="commerce-body" x="335" y="215.5" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">API Spring Boot</text><rect x="334.5" y="235" width="1" height="975" rx="0" data-cell="commerce-lifeline" fill="#CBD5DF" stroke="none" stroke-width="1.2"/><rect x="475" y="145" width="180" height="90" rx="3.6" data-cell="db-header" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.2"/><text data-cell="db-title" x="565" y="180.5" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">Base de datos</text><text data-cell="db-body" x="565" y="215.5" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">PostgreSQL</text><rect x="564.5" y="235" width="1" height="975" rx="0" data-cell="db-lifeline" fill="#CBD5DF" stroke="none" stroke-width="1.2"/><rect x="705" y="145" width="180" height="90" rx="3.6" data-cell="publisher-header" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.2"/><text data-cell="publisher-title" x="795" y="180.5" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">Publicador outbox</text><text data-cell="publisher-body" x="795" y="215.5" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Interno de Comercio</text><rect x="794.5" y="235" width="1" height="975" rx="0" data-cell="publisher-lifeline" fill="#CBD5DF" stroke="none" stroke-width="1.2"/><rect x="935" y="145" width="180" height="90" rx="3.6" data-cell="kafka-header" fill="#F0F6FD" stroke="#CBD5DF" stroke-width="1.2"/><text data-cell="kafka-title" x="1025" y="180.5" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="middle" fill="#182D43">Eventos</text><text data-cell="kafka-body" x="1025" y="215.5" font-size="16" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Kafka</text><rect x="1024.5" y="235" width="1" height="975" rx="0" data-cell="kafka-lifeline" fill="#CBD5DF" stroke="none" stroke-width="1.2"/><path d="M 105 285 L 335 285" data-cell="create" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 335 355 L 565 355" data-cell="begin" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 335 420 L 565 420" data-cell="reserve" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 335 485 L 565 485" data-cell="save" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 335 550 L 565 550" data-cell="commit" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 565 610 L 335 610" data-cell="committed" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M 335 675 L 105 675" data-cell="created" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text data-cell="separation" x="30" y="730.4" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#1B7569">Publicador tras commit SQL; no espera al cliente. Scope: array JSON de cinco componentes.</text><text data-cell="separation" x="30" y="755.6" font-size="18" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-style="normal" text-anchor="start" fill="#1B7569">scope_version=2 se guarda aparte. Publicación y respuesta HTTP pueden intercalarse.</text><path d="M 795 805 L 565 805" data-cell="read" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 565 895 L 795 895" data-cell="pending" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M 795 965 L 1025 965" data-cell="publish" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1025 1040 L 795 1040" data-cell="ack" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M 795 1125 L 565 1125" data-cell="mark" fill="none" stroke="#7D8D9C" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/><text data-cell="footer" x="30" y="1251.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">El envío puede adelantarse a la respuesta HTTP; aquí se muestra una intercalación posible.</text><text data-cell="footer" x="30" y="1275.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="start" fill="#58697A">Caer después de publicar y antes de marcar admite repetición: el consumidor deduplica por eventId.</text><rect data-label-for="create" x="100" y="235.6" width="240" height="48.8" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="create" data-label-for="create" x="220" y="256.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Crear pedido</text><text data-cell="create" data-label-for="create" x="220" y="280.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">+ clave idempotente</text><rect data-label-for="begin" x="330" y="305.6" width="240" height="48.8" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="begin" data-label-for="begin" x="450" y="326.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">BEGIN + advisory lock</text><text data-cell="begin" data-label-for="begin" x="450" y="350.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Ámbito idempotente V2</text><rect data-label-for="reserve" x="330" y="382.5" width="240" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="reserve" data-label-for="reserve" x="450" y="403.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Reservar stock si hay unidades</text><rect data-label-for="save" x="330" y="435.6" width="240" height="48.8" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="save" data-label-for="save" x="450" y="456.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Guardar pedido, resultado</text><text data-cell="save" data-label-for="save" x="450" y="480.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">y evento pendiente (outbox)</text><rect data-label-for="commit" x="330" y="512.5" width="240" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="commit" data-label-for="commit" x="450" y="533.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">COMMIT</text><rect data-label-for="committed" x="330" y="622.5" width="240" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="committed" data-label-for="committed" x="450" y="643.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Transacción confirmada</text><rect data-label-for="created" x="100" y="687.5" width="240" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="created" data-label-for="created" x="220" y="708.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">201 · pedido creado</text><rect data-label-for="read" x="560" y="817.5" width="240" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="read" data-label-for="read" x="680" y="838.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Leer pendientes con bloqueo</text><rect data-label-for="pending" x="560" y="857.5" width="240" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="pending" data-label-for="pending" x="680" y="878.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Lote pendiente</text><rect data-label-for="publish" x="790" y="927.5" width="240" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="publish" data-label-for="publish" x="910" y="948.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Publicar Pedido creado</text><rect data-label-for="ack" x="790" y="1052.5" width="240" height="25" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="ack" data-label-for="ack" x="910" y="1073.5" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Confirmación del broker</text><rect data-label-for="mark" x="560" y="1125.6" width="240" height="48.8" rx="3" fill="#FFFFFF" stroke="none"/><text data-cell="mark" data-label-for="mark" x="680" y="1146.6" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">Marcar publicado</text><text data-cell="mark" data-label-for="mark" x="680" y="1170.4" font-size="17" font-family="Arial,Helvetica,sans-serif" font-weight="400" font-style="normal" text-anchor="middle" fill="#58697A">y confirmar SQL</text></svg>

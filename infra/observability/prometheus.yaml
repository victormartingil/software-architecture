global:
  scrape_interval: 5s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: commerce
    metrics_path: /actuator/prometheus
    static_configs: [{targets: ["commerce-api:8080"]}]
  - job_name: ai
    metrics_path: /metrics
    static_configs: [{targets: ["ai-service:8081"]}]
  - job_name: analytics
    static_configs: [{targets: ["order-analytics:9404"]}]

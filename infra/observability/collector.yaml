receivers:
  otlp:
    protocols:
      http: {endpoint: "0.0.0.0:4318"}
      grpc: {endpoint: "0.0.0.0:4317"}
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 180
    spike_limit_mib: 40
  batch: {}
exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls: {insecure: true}
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]

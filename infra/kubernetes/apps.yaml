# Local reference applications. AI/Streams stay single-writer with Recreate.
---
apiVersion: v1
kind: Service
metadata:
  name: commerce-api
  namespace: architecture-reference
spec:
  type: NodePort
  selector:
    app: commerce-api
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: commerce-api
  namespace: architecture-reference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commerce-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: commerce-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: commerce-api
        image: architecture-reference/commerce-api:local
        imagePullPolicy: Never
        env:
        - name: OIDC_ISSUER
          value: http://localhost:8088/realms/reference
        - name: OIDC_AUDIENCE
          value: reference-api
        - name: DB_URL
          value: jdbc:postgresql://postgres:5432/commerce
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: OIDC_JWKS
          value: http://keycloak:8080/realms/reference/protocol/openid-connect/certs
        - name: JAVA_TOOL_OPTIONS
          value: -Xms128m -Xmx384m
        - name: MANAGEMENT_TRACING_SAMPLING_PROBABILITY
          value: '0.0'
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: local-credentials
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: local-credentials
              key: DB_PASSWORD
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        ports:
        - containerPort: 8080
        startupProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          periodSeconds: 10
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workflows
  namespace: architecture-reference
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: architecture-reference
spec:
  type: NodePort
  selector:
    app: ai-service
  ports:
  - port: 8081
    targetPort: 8081
    nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: architecture-reference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: ai-service
        image: architecture-reference/ai-service:local
        imagePullPolicy: Never
        env:
        - name: OIDC_ISSUER
          value: http://localhost:8088/realms/reference
        - name: OIDC_AUDIENCE
          value: reference-api
        - name: OIDC_JWKS_URL
          value: http://keycloak:8080/realms/reference/protocol/openid-connect/certs
        - name: COMMERCE_URL
          value: http://commerce-api:8080
        - name: WORKFLOW_DB
          value: /data/workflows.sqlite
        - name: AI_PROVIDER
          value: fake
        - name: VECTOR_DSN
          valueFrom:
            secretKeyRef:
              name: local-credentials
              key: VECTOR_DSN
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: workflows
          mountPath: /data
        ports:
        - containerPort: 8081
        startupProbe:
          httpGet:
            path: /health
            port: 8081
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          periodSeconds: 10
      volumes:
      - name: workflows
        persistentVolumeClaim:
          claimName: workflows
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: streams
  namespace: architecture-reference
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-analytics
  namespace: architecture-reference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-analytics
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: order-analytics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: order-analytics
        image: architecture-reference/order-analytics:local
        imagePullPolicy: Never
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: STATE_DIR
          value: /state
        - name: JAVA_TOOL_OPTIONS
          value: -Xms128m -Xmx384m
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 768Mi
        volumeMounts:
        - name: streams
          mountPath: /state
        startupProbe:
          exec: &id001
            command:
            - /bin/sh
            - -ec
            - test -f /tmp/analytics-ready
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec: *id001
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /live
            port: 9404
          periodSeconds: 15
          failureThreshold: 3
      volumes:
      - name: streams
        persistentVolumeClaim:
          claimName: streams
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: commerce-api
  namespace: architecture-reference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: commerce-api
  minReplicas: 1
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: commerce-api
  namespace: architecture-reference
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: commerce-api
